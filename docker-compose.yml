services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop_payments
    volumes:
      # Postgres runs these files in name order when it creates a new, empty database.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # 5434 avoids clashing with other local Postgres instances; override with DB_PORT.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop_payments"]
      interval: 2s
      timeout: 3s
      retries: 15
